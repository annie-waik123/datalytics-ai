<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141a2e"/>
      <stop offset="1" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="45%" stop-color="#ff6d00"/>
      <stop offset="100%" stop-color="#cc2800"/>
    </linearGradient>
    <linearGradient id="topHigh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rightShade" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#ff4d2e" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="96" height="96" rx="22" fill="url(#bg)"/>
  
  <!-- Outer border -->
  <rect x="1" y="1" width="94" height="94" rx="21" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Ambient base glow -->
  <ellipse cx="48" cy="74" rx="28" ry="7" fill="#ff6d00" opacity="0.65" filter="url(#glow)"/>

  <!-- 3D Transform simulation -->
  <g transform="matrix(0.96, -0.08, 0, 0.94, 2, 8)">
    <!-- Bar 1 (Left) -->
    <g transform="translate(18, 42)" filter="url(#shadow)">
      <rect x="0" y="0" width="16" height="34" rx="4" fill="url(#barGrad)"/>
      <rect x="0" y="0" width="16" height="14" rx="4" fill="url(#topHigh)"/>
      <rect x="10" y="0" width="6" height="34" rx="4" fill="url(#rightShade)"/>
      <path d="M4,1.5 L12,1.5" stroke="rgba(255,255,255,0.65)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Bar 2 (Middle) -->
    <g transform="translate(40, 16)" filter="url(#shadow)">
      <rect x="0" y="0" width="16" height="60" rx="4" fill="url(#barGrad)"/>
      <rect x="0" y="0" width="16" height="20" rx="4" fill="url(#topHigh)"/>
      <rect x="10" y="0" width="6" height="60" rx="4" fill="url(#rightShade)"/>
      <path d="M4,1.5 L12,1.5" stroke="rgba(255,255,255,0.65)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Bar 3 (Right) -->
    <g transform="translate(62, 32)" filter="url(#shadow)">
      <rect x="0" y="0" width="16" height="44" rx="4" fill="url(#barGrad)"/>
      <rect x="0" y="0" width="16" height="16" rx="4" fill="url(#topHigh)"/>
      <rect x="10" y="0" width="6" height="44" rx="4" fill="url(#rightShade)"/>
      <path d="M4,1.5 L12,1.5" stroke="rgba(255,255,255,0.65)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>
